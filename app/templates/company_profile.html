{% extends "base.html" %}
{% block title %}公司资料 - Web3 招聘{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto card p-8 shadow-soft">
  <h1 class="text-2xl font-semibold">公司资料</h1>
  <p class="text-sm text-ink-500 mt-1">完整的资料有助于候选人了解项目并主动联系。</p>
  <form method="post" action="/me/company" class="mt-6 space-y-5">
    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="label">公司名称 *</label>
        <input class="input" name="cname" required value="{{ company.cname or '' if company else '' }}" />
      </div>
      <div>
        <label class="label">官网</label>
        <input class="input" name="cnet" value="{{ company.cnet or '' if company else '' }}" />
      </div>
      <div>
        <label class="label">公司类型</label>
        <select class="input" name="ctype">
          {% for k,v in dicts.CTYPE.items() %}
            <option value="{{ k }}" {% if company and company.ctype == k %}selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="label">公司规模</label>
        <select class="input" name="wrks">
          {% for k,v in dicts.WRKS.items() %}
            <option value="{{ k }}" {% if company and company.wrks == k %}selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="label">主要区块链（编号，逗号分隔）</label>
        <input class="input" name="chains" placeholder="如 2,4" value="{{ company.chains or '' if company else '' }}" />
        <p class="text-xs text-ink-300 mt-1">
          {% for k,v in dicts.CHAINS.items() %}<span class="mr-2">{{ k }}={{ v }}</span>{% endfor %}
        </p>
      </div>
      <div>
        <label class="label">LOGO 文件名</label>
        <input class="input" name="clogo" placeholder="logo.png" value="{{ company.clogo or '' if company else '' }}" />
      </div>
    </div>
    <div>
      <label class="label">一句话口号</label>
      <input class="input" name="cim" value="{{ company.cim or '' if company else '' }}" />
    </div>
    <div>
      <label class="label">公司简介</label>
      <textarea class="input min-h-[140px]" name="cdesc">{{ company.cdesc or '' if company else '' }}</textarea>
    </div>
    <div class="grid md:grid-cols-3 gap-3">
      <div><label class="label">Telegram</label><input class="input" name="tg" value="{{ company.tg or '' if company else '' }}"/></div>
      <div><label class="label">WhatsApp</label><input class="input" name="ws" value="{{ company.ws or '' if company else '' }}"/></div>
      <div><label class="label">Twitter</label><input class="input" name="tt" value="{{ company.tt or '' if company else '' }}"/></div>
      <div><label class="label">Discord</label><input class="input" name="disc" value="{{ company.disc or '' if company else '' }}"/></div>
      <div><label class="label">Github</label><input class="input" name="git" value="{{ company.git or '' if company else '' }}"/></div>
    </div>
    <button class="btn btn-primary">保存资料</button>
  </form>
</div>
{% endblock %}
