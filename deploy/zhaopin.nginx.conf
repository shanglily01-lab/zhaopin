# nginx 反向代理示例：80 -> 5020 (uvicorn)
# 安装：sudo cp deploy/zhaopin.nginx.conf /etc/nginx/sites-available/zhaopin
# 启用：sudo ln -s /etc/nginx/sites-available/zhaopin /etc/nginx/sites-enabled/
# 测试：sudo nginx -t && sudo systemctl reload nginx
#
# 如需 HTTPS：sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    listen [::]:80;
    server_name jobsweb3.net;

    client_max_body_size 16M;

    # 静态资源直接由 nginx 处理，绕过 uvicorn
    location /static/ {
        alias /opt/zhaopin/app/static/;
        expires 30d;
        access_log off;
    }

    location /uploads/ {
        alias /opt/zhaopin/uploads/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# www -> 裸域跳转（可选，但推荐 SEO 友好）
server {
    listen 80;
    listen [::]:80;
    server_name www.jobsweb3.net;
    return 301 $scheme://jobsweb3.net$request_uri;
}
